<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>加入会话 · AnY</title>
<link rel="icon" href="/static/logo-collaboration.svg"><link rel="apple-touch-icon" href="/static/icon-192.png?v=any-1">
<meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070a0f" media="(prefers-color-scheme: dark)">
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color-scheme:light dark;--bg:light-dark(#f0f4f8,#0d131b);--ink:light-dark(#202b37,#e6eef6);--side:light-dark(#e2e9f0,#101720);--paper:light-dark(#f9fbfd,#151d27);--line:light-dark(#bac8d6,#354352);--muted:light-dark(#4d5d6f,#a6b6c7);--danger:light-dark(#a42e39,#ff7a85);background:var(--bg);color:var(--ink)}*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-columns:260px 1fr}aside{padding:24px 16px;background:var(--side);border-right:1px solid var(--line);overflow:auto}h2{font-size:18px}small{color:var(--muted)}button,input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:inherit}input{width:100%;margin:12px 0}button{cursor:pointer}#list button{display:block;width:100%;text-align:left;margin:8px 0}#list button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}main{display:flex;flex-direction:column;min-width:0;padding:24px;overflow:hidden}#feed{flex:1;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.msg{padding:16px 0;border-bottom:1px solid var(--line)}.who{font-size:12px;color:var(--muted);margin-bottom:6px}form{display:flex;gap:8px;padding-top:16px}textarea{flex:1;resize:vertical}#error{color:var(--danger);white-space:pre-wrap}#status{color:var(--muted)}#namePrompt{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px;background:var(--paper)}#namePrompt[hidden]{display:none}@media(max-width:650px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:12px;max-height:42vh}main{padding:16px}h2{margin:0}#list button{display:inline-block;width:auto}}
</style>
<link rel="stylesheet" href="/static/guest.css">
<aside><h2 class="guest-brand"><img src="/static/logo-collaboration.svg" width="36" height="36" alt=""><span>AnY<small>Agents and You</small></span></h2><small>打开邀请，加入会话。</small><label class="key-label" for="key">邀请链接或联系人接入密钥</label><input id="key" type="password" placeholder="粘贴邀请链接或密钥" autocomplete="off"><button id="connect">加入会议室</button> <button id="logout">退出此设备</button><p id="identity"></p><div id="namePrompt" hidden><b>怎么称呼你？</b><p class="hint">只影响显示名称，不改变身份。</p><input id="guestName" maxlength="40" placeholder="访客" autocomplete="nickname"><button id="nameConfirm">继续加入</button></div><div id="list" aria-label="已受邀的会话"></div><p id="error" role="alert"></p></aside>
<main><h2 id="title">选择一个会话</h2><p id="status">请向应用管理员索取联系人密钥。</p><div id="feed" aria-live="polite"></div><form id="send"><textarea id="text" placeholder="输入消息…" disabled></textarea><button id="submit" disabled>发送</button></form></main>
<script>
let token='',rid='',since=0,generation=0,historyFrom=null,permission=false,busy=false,autoOpen=false,presetRoom='',pendingInvite='';
const el=id=>document.getElementById(id);
const KEYS={token:'any_guest_token',deviceKey:'any_guest_device_key',name:'any_guest_name',room:'any_guest_last_room'};
const LEGACY_KEYS={token:'cojam_guest_token',deviceKey:'cojam_guest_device_key',name:'cojam_guest_name',room:'cojam_guest_last_room'};
function saved(key){try{const v=localStorage.getItem(key);if(v)return v;for(const [k,nk] of Object.entries(KEYS)){if(nk===key)return localStorage.getItem(LEGACY_KEYS[k])||''}return ''}catch(e){return ''}}
function save(key,value){try{if(value)localStorage.setItem(key,value);else{localStorage.removeItem(key);for(const [k,nk] of Object.entries(KEYS)){if(nk===key)localStorage.removeItem(LEGACY_KEYS[k])}}}catch(e){}}
function guestDeviceName(){const ua=navigator.userAgent,device=/iPhone/i.test(ua)?'iPhone':/iPad/i.test(ua)?'iPad':/Android/i.test(ua)?'Android':/Macintosh|Mac OS X/i.test(ua)?'Mac':/Windows/i.test(ua)?'Windows':'新设备',browser=/Edg\//i.test(ua)?'Edge':/Chrome\//i.test(ua)?'Chrome':/Safari\//i.test(ua)?'Safari':'浏览器';return device+' · '+browser}
function guestDeviceKey(){let value=saved(KEYS.deviceKey);if(!value){const bytes=crypto.getRandomValues(new Uint8Array(32));value=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');save(KEYS.deviceKey,value)}return value}
function invitationValue(value) {
  const text=(value||'').trim();
  try{const invite=new URLSearchParams(new URL(text).hash.slice(1)).get('invite');if(invite)return invite}catch(e){}
  return text.startsWith('inv_')?text:'';
}
async function request(url,body,auth){const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+(auth===undefined?token:auth),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok){const error=Error(j.error||'请求失败');error.status=r.status;throw error}return j}
function clear(){generation++;rid='';since=0;historyFrom=null;permission=false;el('feed').replaceChildren();el('text').value='';el('text').disabled=el('submit').disabled=true;el('title').textContent='选择一个会话'}
function openRoom(room){clear();rid=room.id;save(KEYS.room,rid);el('title').textContent=room.title;poll();refresh()}
async function refresh(){if(!token)return;const gen=generation;try{const j=await request('/api/external/rooms');if(gen!==generation)return;el('identity').textContent='当前身份：'+j.contact.label+' · 此设备已记住';el('list').replaceChildren();for(const room of j.rooms){const b=document.createElement('button');b.textContent=room.title;b.classList.toggle('on',room.id===rid);b.onclick=()=>openRoom(room);el('list').append(b)}const first=autoOpen;autoOpen=false;const wanted=presetRoom&&j.rooms.find(r=>r.id===presetRoom);presetRoom='';if(wanted){openRoom(wanted);return}if(first&&!rid&&j.rooms.length===1){openRoom(j.rooms[0]);return}if(rid&&!j.rooms.some(r=>r.id===rid)){clear();el('status').textContent='此会话的访问权限已撤销'}else if(!rid)el('status').textContent=j.rooms.length?'选择左侧会话开始交流':'还没有受邀的会话，请联系管理员。';el('error').textContent=''}catch(e){autoOpen=false;if(e.status===401){clear();el('list').replaceChildren();el('identity').textContent='';el('error').textContent='身份暂时无法验证或已被撤销，请检查连接或联系管理员。';return}clear();el('list').replaceChildren();el('error').textContent=e.message}}
function showRecalls(ids){
  for(const id of ids||[]){
    const box=el('feed').querySelector('.msg[data-id="'+id+'"]');
    if(!box||box.dataset.recalled==='true')continue;
    box.dataset.recalled='true';
    box.querySelector('.message-text').textContent='消息已撤回';
    box.querySelector('.recall')?.remove();
    box.querySelector('.shared-downloads')?.remove();
  }
}
async function downloadShared(room, message, file){
  let url;
  try{
    const q=new URLSearchParams({room,message,index:file.index});
    const response=await fetch('/api/external/attachment?'+q,{headers:{Authorization:'Bearer '+token}});
    if(!response.ok)throw Error('附件已撤回或当前无权下载。');
    url=URL.createObjectURL(await response.blob());
    const link=document.createElement('a');link.href=url;link.download=file.name;link.click();
  }catch(e){el('error').textContent=e.message;}
  finally{if(url)setTimeout(()=>URL.revokeObjectURL(url),1000);}
}
async function recall(id){
  const room=rid,gen=generation;
  if(!confirm('撤回这条消息并放回输入框？AnY 会取消它触发的任务，并撤回能关联到它的 Agent 回复。'))return;
  const fallback=el('feed').querySelector('.msg[data-id="'+id+'"] .message-text')?.textContent||'';
  try{
    const res=await request('/api/external/recall',{room,id});
    if(gen!==generation)return;
    showRecalls(res?.recalled||[id]);
    const restoredText=typeof res?.restored?.text==='string'?res.restored.text:(typeof res?.draft?.text==='string'?res.draft.text:fallback);
    if(restoredText){
      const input=el('text');
      input.value=input.value?restoredText+'\n'+input.value:restoredText;
      input.focus();
    }
    if(res?.stop_error)el('error').textContent=res.stop_error;
    poll();
  }
  catch(e){if(gen===generation)el('error').textContent=e.message}
}
async function poll(){
  if(!rid||busy)return;
  const gen=generation,room=rid;busy=true;
  try{
    const j=await request('/api/external/messages?room='+encodeURIComponent(room)+'&since='+since);
    if(gen!==generation)return;
    if(historyFrom!==null&&j.history_from!==historyFrom){
      since=0;historyFrom=j.history_from;el('feed').replaceChildren();return;
    }
    historyFrom=j.history_from??null;
    for(const m of j.messages){
      const box=document.createElement('div');box.className='msg';box.dataset.id=m.id;box.dataset.recalled=!!m.recalled;
      const who=document.createElement('div');who.className='who';who.textContent=m.speaker+' · '+m.time;
      box.dataset.role=m.role||'';
      if(m.role==='ai'||m.role==='human'){
        const badge=document.createElement('span');badge.className='speaker-kind';
        badge.textContent=m.role==='ai'?'AI':m.speaker===j.self?'你':'成员';
        who.prepend(badge);
      }
      if(m.speaker===j.self&&!m.recalled){
        const button=document.createElement('button');button.type='button';button.className='recall';button.textContent='撤回';
        button.onclick=()=>recall(m.id);who.append(' ',button);
      }
      const text=document.createElement('div');text.className='message-text';text.textContent=m.text;
      box.append(who,text);
      if(m.shared_attachments?.length){
        const downloads=document.createElement('div');downloads.className='shared-downloads';
        for(const file of m.shared_attachments){const button=document.createElement('button');button.type='button';button.textContent='下载 '+file.name;button.onclick=()=>downloadShared(room,m.id,file);downloads.append(button);}
        box.append(downloads);
      }
      el('feed').append(box);
    }
    showRecalls(j.recalled);
    if(j.messages.length)el('feed').scrollTop=el('feed').scrollHeight;
    since=j.next;permission=j.permissions.post;
    el('text').disabled=el('submit').disabled=!permission;
    el('status').textContent=permission?'以自己的联系人身份发言':'此会话为只读';
  }catch(e){if(gen===generation){clear();el('error').textContent=e.message}}
  finally{busy=false}
}
async function redeemInvite(invite){clear();el('error').textContent='';try{const body={invite,device_key:guestDeviceKey(),name:saved(KEYS.name),device:guestDeviceName()};if(token)body.token=token;const j=await request('/api/guest/redeem',body,'');if(j.token){token=j.token;save(KEYS.token,token)}save(KEYS.name,j.contact.label);el('key').value='';history.replaceState(null,'',location.pathname+location.search);presetRoom=j.room||'';autoOpen=!presetRoom;await refresh()}catch(e){el('error').textContent=e.message}}
function askName(invite){pendingInvite=invite;el('namePrompt').hidden=false;el('guestName').value=saved(KEYS.name)||'访客';el('guestName').focus();el('nameConfirm').onclick=()=>{const name=el('guestName').value.trim()||'访客';save(KEYS.name,name);el('namePrompt').hidden=true;const value=pendingInvite;pendingInvite='';redeemInvite(value)}}
async function connectClient(key){clear();token=invitationKey(key);autoOpen=false;el('key').value='';el('error').textContent='';try{await request('/api/external/hello',{client:'AnY 游客'});save(KEYS.token,token);save(KEYS.deviceKey,'');el('identity').textContent='';autoOpen=true;await refresh()}catch(e){autoOpen=false;token='';el('error').textContent=e.message}}
function invitationKey(value) {
  const text=(value||'').trim();
  try{const key=new URLSearchParams(new URL(text).hash.slice(1)).get('key');if(key)return key}catch(e){}
  return text;
}
el('connect').onclick=()=>{const value=el('key').value,invite=invitationValue(value);if(invite){if(token||saved(KEYS.name))redeemInvite(invite);else askName(invite)}else connectClient(value)};
el('logout').onclick=()=>{token='';save(KEYS.token,'');save(KEYS.deviceKey,'');save(KEYS.name,'');save(KEYS.room,'');clear();el('list').replaceChildren();el('identity').textContent='';el('status').textContent='已退出此设备'};
el('send').onsubmit=async e=>{e.preventDefault();const text=el('text').value.trim(),room=rid,gen=generation;if(!text||!permission)return;el('submit').disabled=true;try{const result=await request('/api/post',{room,text});if(gen===generation){el('text').value='';await poll();el('error').textContent=(result.dispatch_errors||[]).map(item=>'@'+item.agent+' · '+item.reason).join('。')}}catch(e){el('error').textContent=e.message}finally{el('submit').disabled=!permission}};
setInterval(poll,1500);setInterval(refresh,5000);
setInterval(()=>{if(token)request('/api/external/hello',{client:'AnY 游客'}).catch(e=>{if(e.status===401){clear();el('list').replaceChildren();el('identity').textContent='';el('error').textContent='身份暂时无法验证或已被撤销，请检查连接或联系管理员。'}})},20000);
  // A remembered own-device credential can restore the HttpOnly cookie after
  // a browser restart; it is scoped to this browser and this exact origin.
  async function restoreOwnDevice(){
    const key='any_owner_device_token',legacyKey='cojam_owner_device_token';
    let own=saved(key)||saved(legacyKey);
    try {
      // A valid HttpOnly cookie may survive even when Safari cleared localStorage.
      if(!own){
        const page=await (await fetch('/',{cache:'no-store'})).text();
        const match=page.match(/<meta\s+name="rt-token"\s+content="(dev_[^"]+)"/);
        if(!match)return false;
        own=match[1];save(key,own);
      }
      const response=await fetch('/api/devices/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:own})});
      if(response.status===401){save(key,'');save(legacyKey,'');return false}
      if(!response.ok)return false;
      const html=await (await fetch('/',{cache:'no-store'})).text();
      if(!html.includes('name="rt-'+'token" content="'+own+'"'))return false;
      let destination='/';
      const invite=new URLSearchParams(location.hash.slice(1)).get('invite');
      if(invite){
        try{
          const resolved=await fetch('/api/invites/resolve-owner',{method:'POST',headers:{'Content-Type':'application/json','X-RT-Token':own},body:JSON.stringify({invite})});
          if(resolved.ok){const data=await resolved.json();if(data.room)destination='/?r='+encodeURIComponent(data.room)}
        }catch(e){}
      }
      location.replace(destination);return true;
    }catch(e){return false}
  }
  (async()=>{
    if(await restoreOwnDevice())return;
    token=saved(KEYS.token);
    const hash=new URLSearchParams(location.hash.slice(1)),invite=hash.get('invite')||'',initialKey=hash.get('key')||'';
    if(invite){history.replaceState(null,'',location.pathname+location.search);if(token||saved(KEYS.name))redeemInvite(invite);else askName(invite)}
    else if(initialKey){history.replaceState(null,'',location.pathname+location.search);connectClient(initialKey)}
    else if(token){presetRoom=saved(KEYS.room);autoOpen=true;refresh()}
  })();
</script></html>
