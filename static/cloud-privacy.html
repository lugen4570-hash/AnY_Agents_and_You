<title>AnY 云账号测试隐私政策</title>
<main>
  <h1>AnY 云账号测试隐私政策</h1>
  <p>测试服务用微信测试号标识或经 Supabase Auth 验证的手机号身份识别账号。设备登记包含随机安装编号、设备名称及会话时间。</p>
  <p>只有在你开启同步后，AnY 才会上传外观主题和界面语言。模型密钥、访问令牌、本机路径、会议正文和附件保留在本机。</p>
  <p>本机保存云账号会话凭据以维持登录。退出云账号或从其他设备将本机下线会撤销会话。测试记录可联系测试组织者清理。</p>
</main>
</html>
