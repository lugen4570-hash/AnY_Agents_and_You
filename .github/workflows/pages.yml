name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path _site/downloads | Out-Null
          Copy-Item website/* _site -Recurse -Force
          $manifest = Get-Content website/update.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          # Publish an update manifest only when its exact installer is available and verified.
          gh release view "v$version" --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release download "v$version" --repo "${{ github.repository }}" `
              --pattern "Cojam-Setup-$version.exe" --pattern "Cojam-Portable-$version.exe" `
              --dir _site/downloads --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release downloads failed for v$version" }
            $installer = "_site/downloads/Cojam-Setup-$version.exe"
            if (-not (Test-Path $installer)) { throw "Installer missing from Release v$version" }
            if ((Get-Item $installer).Length -ne [long]$manifest.size -or
                (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256.ToLowerInvariant()) {
              throw "Installer does not match update.json"
            }
          } else {
            Write-Warning "Release v$version is unavailable; publishing the website without update.json or downloads."
            Remove-Item _site/update.json -Force
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
