name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble site
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path _site/downloads | Out-Null
          Copy-Item website/* _site -Recurse -Force
          $cliSources = @(
            'bridge', 'static', 'index.html', 'roundtable.py', 'pyproject.toml', 'README.md', 'LICENSE', 'docs/CLI.md',
            'packaging/member-readme.md', 'packaging/start-member.bat', 'packaging/start-member.command'
          )
          New-Item -ItemType Directory -Force -Path _site/cli | Out-Null
          $commit = git rev-parse HEAD
          $cliArchive = "_site/cli/cojam-cli-$commit.tar.gz"
          git archive --format=tar.gz --prefix=Cojam-CLI/ --output=$cliArchive HEAD -- @cliSources
          if ($LASTEXITCODE -ne 0) { throw "CLI source bundle build failed" }
          @{
            commit = $commit
            sha256 = (Get-FileHash -LiteralPath $cliArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            size = (Get-Item -LiteralPath $cliArchive).Length
          } | ConvertTo-Json | Set-Content _site/cli/current.json -Encoding utf8NoBOM
          $macBundle = python packaging/build_macos_python.py
          if ($LASTEXITCODE -ne 0) { throw "macOS source bundle build failed" }
          $macArchive = Get-Item -LiteralPath $macBundle
          if ($macArchive.Name -notmatch '^Cojam-(?<version>\d+\.\d+\.\d+)-macOS-Python\.zip$') {
            throw "Invalid macOS archive name: $($macArchive.Name)"
          }
          @{
            app = 'Cojam'
            version = $Matches.version
            url = "https://lugen4570-hash.github.io/Cojam/downloads/$($macArchive.Name)"
            sha256 = (Get-FileHash -LiteralPath $macBundle -Algorithm SHA256).Hash.ToLowerInvariant()
            size = $macArchive.Length
          } | ConvertTo-Json | Set-Content _site/macos-update.json -Encoding utf8NoBOM
          Copy-Item -LiteralPath $macBundle -Destination _site/downloads/
          Copy-Item -LiteralPath $macBundle -Destination _site/downloads/Cojam-macOS-Python.zip
          $manifest = Get-Content website/update.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          # Publish an update manifest only when its exact installer is available and verified.
          gh release view "v$version" --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release download "v$version" --repo "${{ github.repository }}" `
              --pattern "Cojam-Setup-$version.exe" --pattern "Cojam-Portable-$version.exe" `
              --dir _site/downloads --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release downloads failed for v$version" }
            $installer = "_site/downloads/Cojam-Setup-$version.exe"
            if (-not (Test-Path $installer)) { throw "Installer missing from Release v$version" }
            if ((Get-Item $installer).Length -ne [long]$manifest.size -or
                (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256.ToLowerInvariant()) {
              throw "Installer does not match update.json"
            }
          } else {
            Write-Warning "Release v$version is unavailable; publishing the website without update.json or downloads."
            Remove-Item _site/update.json -Force
            $global:LASTEXITCODE = 0
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
