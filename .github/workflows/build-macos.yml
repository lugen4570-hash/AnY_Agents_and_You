name: Verify macOS desktop builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from the same ZIP provided by the website
        id: compile
        run: |
          python tests/test_macos_distribution.py
          archive=$(python packaging/build_macos_python.py)
          ditto -x -k "$archive" "$RUNNER_TEMP/mac-package"
          "$RUNNER_TEMP/mac-package/Cojam/构建合拍桌面版.command"
      - name: Verify the app signature
        run: codesign --verify --deep --strict "$RUNNER_TEMP/mac-package/Cojam/dist/Cojam.app"
      - name: Exercise the packaged macOS window and native folder picker
        timeout-minutes: 6
        run: |
          python tests/macos_gui_smoke.py \
            "$RUNNER_TEMP/mac-package/Cojam/dist/Cojam.app" "$RUNNER_TEMP/cojam-gui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cojam-GUI-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/cojam-gui/*.png
            ${{ runner.temp }}/cojam-gui/core-*.txt
            ${{ runner.temp }}/cojam-gui/desktop.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          name: Cojam-desktop-${{ matrix.runner }}
          path: ${{ runner.temp }}/mac-package/Cojam/dist/Cojam-*-macOS-*.zip
