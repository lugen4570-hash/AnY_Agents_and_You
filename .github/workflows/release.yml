name: Release AnY (Windows + macOS)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/release-windows.yml

  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      intel_only: true

  macos-arm64:
    uses: ./.github/workflows/build-macos-arm-fallback.yml
    with:
      source_tag: ${{ github.ref_name }}

  cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux CLI with fresh managed Python and run any --help
        run: python packaging/smoke_cli_install.py

  publish:
    needs: [windows, macos, macos-arm64, cli-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Build macOS Python ZIP and verify all release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python -c "from bridge.version import VERSION; print(VERSION)")
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v${ver}" ]]; then
            echo "Git tag ${{ github.ref_name }} does not match bridge/version.py (${ver})" >&2
            exit 1
          fi
          python packaging/build_macos_python.py --output-dir release-artifacts
          cd release-artifacts
          sha256sum -c "SHA256SUMS-${ver}.txt"
          sha256sum -c "SHA256SUMS-macOS-arm64.txt"
          sha256sum -c "SHA256SUMS-macOS-x86_64.txt"
          sha256sum -c "AnY-${ver}-macOS-Python.zip.sha256"
          required=(
            "AnY-Setup-${ver}.exe"
            "AnY-Portable-${ver}.exe"
            "AnY-Desktop-${ver}-win64.zip"
            "AnY-${ver}-win64.zip"
            "AnY-Member-${ver}.zip"
            "AnY-${ver}-macOS-arm64.dmg"
            "AnY-${ver}-macOS-x86_64.dmg"
            "AnY-${ver}-macOS-arm64.zip"
            "AnY-${ver}-macOS-x86_64.zip"
            "AnY-${ver}-macOS-Python.zip"
            "build-report-${ver}.json"
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing expected release artifact: $file" >&2
              exit 1
            fi
          done
          sha256sum "${required[@]}" > "SHA256SUMS-${ver}.txt"
          {
            echo "## AnY ${ver} Release SHA-256"
            echo '```'
            cat "SHA256SUMS-${ver}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
        id: verify

      - name: Verify uploaded assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${{ steps.verify.outputs.version }}"
          tag="v${ver}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite." >&2
            exit 1
          fi
          cd release-artifacts
          assets=(
            "AnY-Setup-${ver}.exe"
            "AnY-Portable-${ver}.exe"
            "AnY-Desktop-${ver}-win64.zip"
            "AnY-${ver}-win64.zip"
            "AnY-Member-${ver}.zip"
            "AnY-${ver}-macOS-arm64.dmg"
            "AnY-${ver}-macOS-x86_64.dmg"
            "AnY-${ver}-macOS-arm64.zip"
            "AnY-${ver}-macOS-x86_64.zip"
            "AnY-${ver}-macOS-Python.zip"
            "SHA256SUMS-${ver}.txt"
            "build-report-${ver}.json"
          )
          gh release create "$tag" --repo "${{ github.repository }}" --verify-tag --draft --title "AnY ${ver}" --notes-file <(
            echo "AnY ${ver} 正式安装包与校验文件。"
            echo 'Apple 芯片版已核验架构、签名和 DMG 内容，Apple Silicon 原生启动待验收。'
            echo ""
            echo "### SHA-256"
            echo '```'
            cat "SHA256SUMS-${ver}.txt"
            echo '```'
          ) "${assets[@]}"
          python - "$ver" "${{ github.repository }}" "${assets[@]}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          ver, repo, *expected = sys.argv[1:]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases", "--paginate", "--slurp"],
              text=True,
          )
          from hashlib import file_digest

          release = next(item for page in json.loads(raw) for item in page if item["tag_name"] == f"v{ver}")
          remote = {item["name"]: item for item in release["assets"]}
          for name in expected:
              path = pathlib.Path(name)
              with path.open("rb") as asset:
                  digest = "sha256:" + file_digest(asset, "sha256").hexdigest()
              uploaded = remote.get(name, {})
              if (uploaded.get("size"), uploaded.get("digest")) != (path.stat().st_size, digest):
                  raise SystemExit(f"Uploaded asset size or SHA-256 mismatch: {name}")
          PY
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false
