[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge-room"
version = "2.8.9"
description = "本机多会议室：你 + 任意几个 AI（Claude Code、Codex、Gemini CLI、自己的 harness……）一起开会、一起干活"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ai", "agent", "claude", "codex", "meeting", "roundtable", "local"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]
dev = ["mypy>=1.11", "ruff>=0.6"]

[project.scripts]
ai-bridge = "bridge.web:main"
ai-bridge-doctor = "bridge.doctor:cli"

[project.urls]
Homepage = "https://lugen4570-hash.github.io/Cojam/"
Documentation = "https://github.com/lugen4570-hash/Cojam/tree/main/docs"
Repository = "https://github.com/lugen4570-hash/Cojam"

[tool.setuptools]
packages = ["bridge", "bridge.pal"]
include-package-data = true

[tool.setuptools.package-data]
bridge = ["presets/*.json", "catalog/*.json"]

[tool.pytest.ini_options]
# 测试都是 unittest，每个文件单独跑（python tests\test_xxx.py）
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["bridge"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "bridge.version",
  "bridge.pal",
  "bridge.pal.*",
  "bridge.access",
  "bridge.common",
  "bridge.execution",
  "bridge.mcp",
  "bridge.mcp_stdio",
  "bridge.members",
]
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["bridge.drivers"]
ignore_errors = true

[tool.ruff]
target-version = "py312"
exclude = ["bridge/drivers.py"]

[tool.ruff.lint]
select = ["E9", "F", "W6"]
