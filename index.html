<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="rt-token" content="__RT_TOKEN__">
<meta name="theme-color" content="#F0F4F8" data-theme="light" data-system-media="(prefers-color-scheme: light)" media="not all">
<meta name="theme-color" content="#070A0F" data-theme="dark" data-system-media="(prefers-color-scheme: dark)">
<script src="/static/theme-start.js"></script>
<link rel="icon" href="/static/logo-collaboration.svg">
<link rel="apple-touch-icon" href="/static/icon-192.png?v=any-1">
<title>AnY</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/workspace.css">
<link rel="stylesheet" href="/static/studio.css">
<link rel="stylesheet" href="/static/harness-ui.css">
</head>
<body>
<div id="navShade"></div>
<nav id="rooms" aria-label="联系人和项目"><div class="brand">
  <span class="brand-lockup"><img src="/static/logo-collaboration.svg" width="28" height="28" alt=""><span class="studio-wordmark" role="img" aria-label="AnY"></span></span>
  <button id="navClose" aria-label="收起侧栏" title="收起侧栏 (Ctrl+K)"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="m16 9-3 3 3 3"/></svg></button>
</div>
<button id="rNew" class="nav-new nav-row" type="button"><span class="nav-new-badge" aria-hidden="true">+</span><span class="nav-row-label">新建会话</span></button>
<label class="nav-search nav-row" for="navSearch"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="navSearch" type="search" placeholder="搜索项目或会话" aria-label="搜索项目或会话" autocomplete="off"><kbd aria-hidden="true">⌘ K</kbd></label>
<div class="nav-switch" role="group" aria-label="侧栏视图"><button type="button" id="navSessionsButton" class="nav-row" aria-controls="navSessions" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="nav-row-label">会话</span></button><button type="button" id="navContactsButton" class="nav-row" aria-controls="contactsSection" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="nav-row-label">联系人</span><span id="contactCount"></span></button></div>
<section id="navSessions" class="nav-pane" aria-label="会话">
<section class="projects-section"><div class="rh">项目与会话<span class="project-actions"><button type="button" id="bList" aria-label="会话管理、归档与回收站" title="会话管理、归档与回收站">管理</button><button id="projectAdd" aria-label="新建项目" title="新建项目">＋</button></span></div><ul class="rl" id="roomList"></ul></section>
</section>
<section class="nav-pane contacts-section" id="contactsSection" aria-label="联系人" hidden><div class="rh"><span>全部联系人</span><span class="rh-actions"><button id="agentSettingsBtn" title="修改 Agent 程序位置、模型与加入设置" aria-label="Agent 与连接管理">管理</button><button id="contactsAdd" aria-label="接入联系人">＋ 接入</button></span></div><ul id="contactList"></ul></section>
<div class="nav-foot">
<button type="button" id="accountBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu"><span class="account-avatar" id="accountAvatar" aria-hidden="true">本</span><span class="account-name" id="accountName">本机用户</span><svg class="ui-icon account-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5-5 5 5"/><path d="m7 9 5-5 5 5" opacity=".45"/></svg></button>
<div id="accountMenu" role="menu" aria-label="账户" hidden>
<button type="button" id="openSettingsBtn" role="menuitem" class="nav-settings-btn"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg><span data-i18n="nav.settings">设置</span></button>
<button type="button" id="updateApp" role="menuitem" title="发现新版本，点击更新" hidden>更新</button><button type="button" id="quitApp" role="menuitem" title="停止本机 AnY 服务">退出 AnY</button></div></div><div id="navResizer" class="nav-resizer" aria-hidden="true" title="拖动调整侧栏宽度，双击重置"></div></nav>
<header class="chat-toolbar">
  <button id="navToggle" aria-label="展开侧栏" title="展开侧栏 (Ctrl+K)"><svg class="ui-icon nav-toggle-icon-desktop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span class="nav-toggle-icon-mobile" aria-hidden="true">☰</span></button>
  <div class="room-heading"><span id="roomContext" hidden></span><div id="title">会议室</div></div><div id="wd" hidden></div>
  <div class="header-actions"><span id="modeTag"></span><button type="button" id="sideToggleBtn" aria-label="会议详情与管理" title="会议详情与管理" aria-controls="side" aria-expanded="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button></div>
</header>
<div id="modal"><div id="mbox" role="dialog" aria-modal="true" aria-label="会话设置" tabindex="-1"></div></div>
<div id="cmenu"></div>
<div id="sideBg"></div>
<aside id="side" role="dialog" aria-modal="true" aria-label="会议详情与看板" tabindex="-1" inert>
  <div class="sh"><span data-i18n="side.title">会议详情与看板</span><div class="side-window-actions"><button type="button" id="sidePin" aria-pressed="false">固定</button><button type="button" id="sideX" aria-label="关闭会议详情">&times;</button></div></div>
  <div class="side-actions" aria-label="会话管理"><button type="button" id="bRename">改名</button><button type="button" id="bAgents">成员与权限</button><button type="button" id="bWrap">整理并落盘</button></div>
  <div class="side-tabs" id="sideTabs" role="tablist" aria-label="右侧栏视图">
    <button type="button" role="tab" data-side-tab="agents" aria-selected="true" data-i18n="side.tabAgents">成员</button>
    <button type="button" role="tab" data-side-tab="board" aria-selected="false" data-i18n="side.tabBoard">看板</button>
    <button type="button" role="tab" data-side-tab="changes" aria-selected="false" data-i18n="side.tabChanges">改动</button>
    <button type="button" role="tab" data-side-tab="output" aria-selected="false" data-i18n="side.tabOutput">产出</button>
  </div>
  <div id="sideAgentsPane" class="side-pane" data-side-group="agents"></div>
  <section class="card" data-k="goal" data-side-group="board"><h4><span class="ct">目标</span><button type="button" id="annBtn">编辑</button></h4>
    <div class="cb" id="ann"><div class="top"><div id="annText">（还没写这场会议的目标）</div><button type="button" id="boardBtn" hidden>看板</button></div>
      <div id="annEdit"><textarea id="annTa" placeholder="这场会议要做成什么…（两个 AI 每次被叫时都会看到最新的）"></textarea>
        <div class="btns"><button type="button" id="annSave">保存</button><button type="button" id="annCancel">取消</button></div></div></div></section>
  <section class="card" data-k="board" data-side-group="board"><h4><span class="ct">看板</span><span class="cn" id="boardN"></span></h4>
    <div class="cb" id="board"><ul id="boardList"></ul>
      <div class="badd"><select id="bKind"><option value="todo">待办</option><option value="note">公告</option></select><input id="bText" maxlength="500" placeholder="加一条…"><button type="button" id="bAdd">加</button></div></div></section>
  <div id="sideChangesPane" class="side-pane" data-side-group="changes" hidden></div>
  <section class="card" data-k="claims" data-side-group="changes"><h4><span class="ct">正在改的文件</span><span class="cn" id="claimN"></span><button type="button" id="cMine" title="你自己在手动改的文件，占住它，AI 就不会去改">我在改…</button></h4>
    <div class="cb" id="claims"><ul id="claimList"></ul></div></section>
  <section class="card" data-k="env" data-side-group="output"><h4><span class="ct">环境</span></h4><div class="cb" id="envBox"></div></section>
  <section class="card" data-k="ctx" data-side-group="agents"><h4><span class="ct">上下文</span></h4><div class="cb" id="ctxBox"></div></section>
  <section class="card" data-k="out" data-side-group="output"><h4><span class="ct">产出</span><span class="cn" id="outN"></span></h4><div class="cb" id="outBox"></div></section>
</aside>
<div id="feed"></div>
<div id="toc"><div class="hd">我的发言 <span class="n" id="tocN"></span><input id="tocQ" placeholder="搜一下…" aria-label="搜我的发言"><button type="button" id="tocX" aria-label="关闭">&times;</button></div><ul id="tocList"></ul></div>
<div id="viewer">
  <div class="vbar vview"><span class="grow" id="vInfo"></span><button type="button" id="vEdit">标注 / 裁剪</button><a class="vb" id="vOrig" target="_blank" rel="noopener">原图</a><button type="button" id="vClose">关闭</button></div>
  <div class="vbar vedit" id="vTools">
    <button type="button" data-tool="pen" class="on">画笔</button><button type="button" data-tool="arrow">箭头</button><button type="button" data-tool="rect">框</button><button type="button" data-tool="text">文字</button><button type="button" data-tool="crop">裁剪</button><button type="button" data-tool="erase">橡皮擦</button><button type="button" data-tool="mosaic">马赛克</button>
    <span class="sep"></span>
    <button type="button" class="sw on" data-color="#ef4444" style="background:#ef4444" aria-label="红"></button><button type="button" class="sw" data-color="#facc15" style="background:#facc15" aria-label="黄"></button><button type="button" class="sw" data-color="#22c55e" style="background:#22c55e" aria-label="绿"></button><button type="button" class="sw" data-color="#3b82f6" style="background:#3b82f6" aria-label="蓝"></button><button type="button" class="sw" data-color="#ffffff" style="background:#ffffff" aria-label="白"></button><button type="button" class="sw" data-color="#111111" style="background:#111111" aria-label="黑"></button>
    <span class="sep"></span>
    <button type="button" id="vThick" title="线条粗细">中</button><button type="button" id="vUndo" disabled>撤销</button><button type="button" id="vRedo" disabled>重做</button>
    <span class="grow"></span>
    <button type="button" id="vSave" title="下载到本机">存到本机</button><button type="button" id="vCancel">取消</button><button type="button" id="vDone" class="pri">放进输入框</button>
  </div>
  <div id="vStage"><button type="button" class="nav" id="vPrev" aria-label="上一张">&#8249;</button><img id="vImg" alt=""><div id="vWrap"><canvas id="vCv"></canvas><canvas id="vOv"></canvas></div><button type="button" class="nav" id="vNext" aria-label="下一张">&#8250;</button></div>
  <div id="vHint"></div>
</div>
<div id="jump"><button type="button" id="jToc" title="我的发言目录" aria-label="我的发言目录"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button><button type="button" id="jUp" title="上一条我的发言（长按：到顶）" aria-label="上一条我的发言"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button type="button" id="jDn" title="下一条我的发言（长按：到底）" aria-label="下一条我的发言"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div id="status"><div id="stMain"><span id="stText"></span></div><span id="stops"></span></div>
<footer>
  <div id="slashMenu" class="slash-menu" role="listbox" aria-label="命令与技能" hidden></div>
  <div id="composerPopover" class="composer-popover" role="dialog" aria-label="模型设置" hidden></div>
  <div id="greet" hidden><img class="greet-mark" src="/static/logo-mark.svg" width="44" height="44" alt=""><div class="greet-title">今天想和谁一起推进？</div><div class="greet-sub"><span class="greet-first">创建会话后，就可以邀请成员一起协作。</span><span class="greet-chat">@ 点名成员开始，或用 / 调用命令与技能</span></div><button type="button" id="greetNew" hidden>＋ 新建会话</button></div>
  <div class="quick" id="quick"></div>
  <div class="composer-box">
    <div id="quote"><span class="qtx"></span><button type="button" id="quoteX" aria-label="取消引用">&times;</button></div>
    <div id="pend"></div>
    <div class="row composer-input-row"><input type="file" id="file" multiple class="sr-file-input"><textarea id="ta" rows="1" autocomplete="off" aria-label="会话消息" placeholder="有什么新想法？@ 指定成员，/ 命令与技能…"></textarea></div>
    <div class="composer-bar" id="composerBar">
      <div class="composer-controls">
        <button id="clip" type="button" aria-label="添加附件" title="添加附件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button><button type="button" id="composerModeBtn" class="composer-chip mode-chip" title="切换讨论 / 干活模式">讨论模式</button>
        <button type="button" id="composerExtBtn" class="composer-chip ext-chip" title="配置本会话技能、MCP 与扩展 (/skills)">扩展</button>
        <button type="button" id="debateBtn" class="composer-chip">论道</button>
      </div>
      <div class="composer-send-group">
        <button type="button" id="composerModelBtn" class="composer-chip model-chip" aria-haspopup="dialog" aria-expanded="false" title="查看或切换当前会话模型">模型</button>
        <button id="send" type="button" aria-label="发送" title="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
      </div>
    </div>
  </div>
  <div class="composer-meta"><span id="composerTargetHint" class="composer-target-hint"></span><span class="composer-shortcuts" data-i18n="composer.hint">@ 指定成员 · / 命令与技能</span></div>
</footer>
<script src="/static/workspace.js"></script>
<script src="/static/qrcode.min.js"></script>
<script src="/static/connections.js"></script>
<script src="/static/model-settings.js"></script>
<script src="/static/agent-settings.js"></script>
<script src="/static/execution-settings.js"></script>
<script src="/static/app-core.js"></script>
<script src="/static/app-chat.js"></script>
<script src="/static/app-viewer.js"></script>
<script src="/static/app-meeting.js"></script>
<script src="/static/app-runtime.js"></script>
<script src="/static/update.js"></script>
<script src="/static/cloud-account.js"></script>
<script src="/static/harness-ui.js"></script>
</body>
</html>
